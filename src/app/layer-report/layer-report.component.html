<div class="module-container">
  <div class="module-header">
    <div>
      <h3>Layer Report</h3>
      <p class="subtitle">{{ currentFarm?.farm_name }}</p>
    </div>
    <div class="header-actions">
      <button class="btn-generate" (click)="generatePDF()" [disabled]="isGenerating">
        {{ isGenerating ? 'Generating...' : '📄 Generate PDF Report' }}
      </button>
    </div>
  </div>

  <div class="filter-bar" *ngIf="batches.length > 0">
    <div class="filter-group">
      <label>Filter by Batch:</label>
      <select [(ngModel)]="selectedBatchFilter">
        <option value="all">All Batches</option>
        <option *ngFor="let b of batches" [value]="b.batch_id">{{ b.batch_name }}</option>
      </select>
    </div>
  </div>

  <div class="summary-grid" *ngIf="batches.length > 0">
    <div class="summary-card"><div class="card-label">Total Batches</div><div class="card-value">{{ batches.length }}</div></div>
    <div class="summary-card"><div class="card-label">Total Eggs Collected</div><div class="card-value">{{ totalEggs | number }}</div></div>
    <div class="summary-card"><div class="card-label">Egg Sales</div><div class="card-value">Rs. {{ totalEggSales | number:'1.0-0' }}</div></div>
    <div class="summary-card"><div class="card-label">Total Mortality</div><div class="card-value">{{ totalMortality | number }}</div></div>
  </div>

  <div class="sections-panel">
    <div class="sections-panel-header">
      <span class="sections-title">📋 Sections to Include in PDF</span>
      <div class="sections-bulk">
        <button class="bulk-btn" (click)="sections.eggCollection=true; sections.eggSales=true; sections.vaccinations=true; sections.mortality=true; sections.summary=true; savePreferences()">All</button>
        <button class="bulk-btn" (click)="sections.eggCollection=false; sections.eggSales=false; sections.vaccinations=false; sections.mortality=false; sections.summary=false; savePreferences()">None</button>
      </div>
    </div>

    <div class="sections-grid">
      <label class="section-checkbox" [class.checked]="sections.eggCollection">
        <input type="checkbox" [(ngModel)]="sections.eggCollection" (change)="savePreferences()" />
        <span class="checkbox-icon">🥚</span>
        <span class="checkbox-info">
          <span class="checkbox-label">Egg Collection</span>
          <span class="checkbox-meta">{{ filteredEggCollections.length }} records</span>
        </span>
      </label>

      <label class="section-checkbox" [class.checked]="sections.eggSales">
        <input type="checkbox" [(ngModel)]="sections.eggSales" (change)="savePreferences()" />
        <span class="checkbox-icon">🛒</span>
        <span class="checkbox-info">
          <span class="checkbox-label">Egg Sales</span>
          <span class="checkbox-meta">{{ filteredEggSales.length }} records</span>
        </span>
      </label>

      <label class="section-checkbox" [class.checked]="sections.vaccinations">
        <input type="checkbox" [(ngModel)]="sections.vaccinations" (change)="savePreferences()" />
        <span class="checkbox-icon">💉</span>
        <span class="checkbox-info">
          <span class="checkbox-label">Vaccinations</span>
          <span class="checkbox-meta">{{ filteredVaccinations.length }} records</span>
        </span>
      </label>

      <label class="section-checkbox" [class.checked]="sections.mortality">
        <input type="checkbox" [(ngModel)]="sections.mortality" (change)="savePreferences()" />
        <span class="checkbox-icon">⚠️</span>
        <span class="checkbox-info">
          <span class="checkbox-label">Mortality</span>
          <span class="checkbox-meta">{{ filteredMortalities.length }} records</span>
        </span>
      </label>

      <label class="section-checkbox" [class.checked]="sections.summary">
        <input type="checkbox" [(ngModel)]="sections.summary" (change)="savePreferences()" />
        <span class="checkbox-icon">📊</span>
        <span class="checkbox-info">
          <span class="checkbox-label">Summary</span>
          <span class="checkbox-meta">Overview statistics</span>
        </span>
      </label>
    </div>
  </div>
</div>
